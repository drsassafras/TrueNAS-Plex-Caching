# Plex Cache for TrueNAS — paste into Apps → Discover Apps → ⋮ → Install via YAML.
# Name the app with lowercase letters and hyphens, e.g. plex-cache.
#
# Before installing:
#   1. Create a dataset for the app's settings (Datasets → Add Dataset, Dataset
#      Preset "Apps"), and make sure user "apps" (568) can read and write it.
#      Put its path on the /config line below. If the app can't write there,
#      its web page says so and it waits until that's fixed.
#   2. Put your media dataset(s) on the /data line, mounted at the SAME path
#      your Plex app uses inside its container (Plex's own app settings show
#      these mounts). Add one line per mount if Plex has several.
#   3. The optimizer (optional, the second service): give it the same two kinds of
#      line — the settings folder, read-only, and the media it may rewrite, writable.
#      Leave out any media you don't want changed, or the whole service.
#   4. Put your NAS's IP in x-portals at the bottom.
#   (Two services: plex-cache, which only reads media, and plex-cache-optimizer, the only part
#   that writes it — it rewrites files when you ask it to, from the web UI.)
#   5. Set your own PLEXCACHE_PASSWORD (and username) below. The web UI asks for
#      them, and the example password is refused. Commenting both lines out
#      turns the login off, leaving the web UI open to anyone on your network.
#      Changing the password later signs everyone out.
#
# Everything else (Plex address, sign-in, TrueNAS API key, features, MQTT /
# Home Assistant) is set in the web UI at http://<your-nas-ip>:8642 after it starts.
#
# x-portals adds a "Web UI" button in TrueNAS. TrueNAS only reads it when the
# app is first installed, so add it then (not by editing later).
services:
  plex-cache:
    image: ghcr.io/drsassafras/plex-cache:latest
    container_name: plex-cache
    restart: unless-stopped
    user: "568:568"
    ports:
      - "8642:8642"
    environment:
      TZ: America/Toronto            # your time zone, so schedules run at local time
      # Web UI login. CHANGE ME: the example password is refused until you set your own.
      # Put a # in front of both lines to turn the login off (anyone on your network can then use it).
      PLEXCACHE_USERNAME: plex-cache
      PLEXCACHE_PASSWORD: "change-me"
      # PLEXCACHE_URL: https://plexcache.example.com   # only behind a reverse proxy: the address links should use
    volumes:
      - /mnt/tank/apps/plex-cache:/config        # CHANGE ME: settings and history
      - /mnt/tank/plexfiles:/data:ro             # CHANGE ME: media, same container path as Plex
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The app only writes to /config, so the rest of the container is read-only:
    # nothing (not even a bug) can change the app's own files. /tmp is a small scratch space.
    read_only: true
    tmpfs:
      - /tmp:size=16m

  # The optimizer (optional): rewrites media files one at a time when you press Optimize Now in
  # the web UI. It has no web page and no published port; only plex-cache talks to it, with a
  # token the app keeps in its settings folder (mounted here read-only). It can only change
  # files under the media folders mounted here writable.
  plex-cache-optimizer:
    image: ghcr.io/drsassafras/plex-cache:latest
    restart: unless-stopped
    command: ["python", "-m", "plexcache.optimize", "serve"]
    # It writes media as this user. Files it can't write are skipped, and so are files whose
    # owner it can't keep. If your media belongs to another user, run it as that user
    # (e.g. "1000:1000"), or as "0:0" with cap_add: [CHOWN, FOWNER, DAC_OVERRIDE] below.
    user: "568:568"
    volumes:
      - /mnt/tank/apps/plex-cache:/config:ro     # CHANGE ME: the same settings folder as above, read-only
      - /mnt/tank/plexfiles:/data                # CHANGE ME: media it may rewrite, same path as above, writable
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m
    healthcheck:   # its own port (8643), not the web app's
      test: ["CMD", "python", "-m", "plexcache.healthcheck"]

x-portals:
  - name: Web UI
    scheme: http
    host: 192.168.1.10                       # CHANGE ME: your NAS's IP
    port: 8642
    path: /
