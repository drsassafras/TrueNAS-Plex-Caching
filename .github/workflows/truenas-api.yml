name: API watch

# Every week: do the TrueNAS and Syncthing releases in the making (the middleware's master branch, Syncthing's
# main) still declare every API call Dionysus makes? TrueNAS renames methods between releases (zfs.snapshot.*
# became pool.snapshot.* in 25.04); Syncthing moves REST paths. This fails, and GitHub says so, before the
# release reaches anyone's NAS. dev/truenas_api.py, dev/syncthing_api.py.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.15"
      - run: python3 dev/truenas_api.py --ref master
      - run: python3 dev/syncthing_api.py --ref main
        if: always()
