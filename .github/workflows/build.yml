name: Test and publish image

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "41 5 * * 1"  # weekly: the image built again on the release branch, so it carries the newest Python 3.15.x and Debian packages
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    # The Python the image runs — 3.15, its newest patch release — with every deprecation an error, so what a later Python
    # removes shows up here first. The next Python is tried locally, not here: dev/future.py (dev/README.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: python -W error::DeprecationWarning -W error::PendingDeprecationWarning -m unittest tests.test_plexcache -v
      # the type check (pyrightconfig.json): an error is a fault — an undefined name, a variable read before it's set — and
      # a warning an annotation that says less than the code does; both at zero, and kept there (--warnings)
      - run: npx --yes pyright@1.1.414 --warnings

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/plex-cache
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      # Built first without pushing, so the optimizer's tests can run inside it: with the image's own
      # MKVToolNix, ffmpeg, oxipng and jpegtran (the runner has none of them, so there they're skipped).
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: plex-cache:test
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PLEXCACHE_CHANNEL=${{ github.ref == 'refs/heads/dev' && 'dev' || 'stable' }}
            PLEXCACHE_COMMIT=${{ github.sha }}
          pull: true  # (the newest python:3.15-slim-trixie, not a cached one)
      - name: The image's Python has what the code needs (ZSTD, for the block estimates)
        run: docker run --rm --entrypoint python plex-cache:test -c "import compression.zstd as z; print('zstd', z.zstd_version)"
      - name: What this image carries (dev/README.md, Python and the other dependencies)
        run: docker run --rm -v "$PWD:/src:ro" -w /src --entrypoint python plex-cache:test dev/versions.py
      - name: Optimizer tests inside the image
        run: >
          docker run --rm -v "$PWD:/src:ro" -w /src --entrypoint python plex-cache:test
          -W ignore -m unittest -v tests.test_plexcache.FixtureTests tests.test_plexcache.OptimizerTests
          tests.test_plexcache.CoverArtTests
      - name: Push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag plex-cache:test "$tag"
            docker push "$tag"
          done
