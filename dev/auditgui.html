<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security audits</title>
<style>
/*THEME*/
main{max-width:1280px;margin:0 auto;padding:18px 16px 48px}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 4px}
h1{margin:0;font-size:24px}
.where{color:var(--mute);font-size:13px}
nav{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:12px 0 18px}
nav button{font:inherit;font-size:14px;background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);
  padding:8px 12px;cursor:pointer;margin-bottom:-1px}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
h2{font-size:17px;margin:22px 0 10px}
.lead{margin:0 0 14px;max-width:80ch;color:var(--mute)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:0 0 8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.tile b{display:block;font-size:22px;line-height:1.2}
.tile span{color:var(--mute);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.badge{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 9px;
  border-radius:99px;background:var(--code);color:var(--mute);white-space:nowrap}
.badge.good{background:var(--after-bg);color:var(--after)}
.badge.warn{background:var(--before-bg);color:var(--before)}
.badge.bad{background:var(--gone-bg);color:var(--gone)}
code.bad{color:var(--gone);text-decoration:line-through}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.04em;
  border-bottom:1px solid var(--line);padding:6px 8px}
td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
tr.pick{cursor:pointer}tr.pick:hover td{background:var(--code)}
.wrap{overflow-x:auto}
code,.mono{font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
ul.plain{margin:0;padding-left:18px}
button.go,button.quiet{font:inherit;font-size:14px;border-radius:8px;padding:6px 14px;cursor:pointer;border:1px solid var(--ink)}
button.go{background:var(--ink);color:var(--card)}
button.quiet{background:var(--card);color:var(--ink);border-color:var(--line)}
button:disabled{opacity:.5;cursor:default}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
  margin:0 0 6px;cursor:pointer;background:var(--card)}
label.opt:has(input:checked){border-color:var(--ink)}
label.opt small{display:block;color:var(--mute)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
select,input[type=text],input[type=number],textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:6px;padding:5px 8px}
textarea{width:100%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.mute{color:var(--mute)}
.log{max-height:420px;overflow:auto;background:var(--code);border-radius:8px;padding:8px 10px}
.log div{padding:2px 0;white-space:pre-wrap;word-break:break-word}
.log .tool{color:var(--mute)}
.bar{height:8px;border-radius:99px;background:var(--gone-bg);overflow:hidden;min-width:80px;display:flex}
.bar i{display:block;height:100%}
.bar .f{background:var(--after)}.bar .p{background:var(--before)}
.code{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:70vh}
.code div{display:grid;grid-template-columns:4px 52px 1fr;white-space:pre;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
.code div span:nth-child(2){color:var(--mute);text-align:right;padding-right:10px;user-select:none}
.code .g{background:transparent}.code .seen-full .g{background:var(--after)}.code .seen-part .g{background:var(--before)}
.code .unseen .g{background:var(--gone)}
.empty{color:var(--mute);font-style:italic}
.note{font-size:13px;color:var(--mute);margin:6px 0 0}
h3.group{font-size:13px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px}
.cvss{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 10px;margin:8px 0}
.cvss label{display:flex;flex-direction:column;gap:2px}.cvss code{word-break:break-all}.cvss small{color:var(--mute);font-size:12px}
</style>
</head>
<body>
<main>
<header><h1>Security audits</h1><span class="where" id="where"></span></header>
<nav id="tabs"></nav>
<section id="view"></section>
</main>
<script>
"use strict";
const TOKEN = "__TOKEN__";
const TABS = [["overview", "Overview"], ["start", "Start audit"], ["runs", "Runs"], ["findings", "Findings"],
  ["explorer", "Explorer"], ["rules", "Rules"]];
let tab = "overview", timer = 0, opts = null, checkedAt = 0;

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;   // (not a style attribute: the page's CSP allows only its own <style>)
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
}
function put(el, ...kids) { el.replaceChildren(...kids.flat(Infinity).filter(k => k != null && k !== false)); }
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {headers: {"X-Audit-Token": TOKEN}} :
    {method: "POST", headers: {"X-Audit-Token": TOKEN, "Content-Type": "application/json"}, body: JSON.stringify(body)});
  const got = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(got.error || r.statusText);
  return got;
}
const pct = (n, of) => (of ? (100 * n / of).toFixed(1) : "100.0") + "%";
const when = t => t ? new Date(t * 1000).toLocaleString([], {dateStyle: "medium", timeStyle: "short"}) : "";
const took = (a, b) => { const s = Math.max(0, Math.round((b || Date.now() / 1000) - a)); return s < 60 ? s + " s" : Math.round(s / 60) + " min"; };
const STATE = {done: "good", open: "warn", running: "warn", preparing: "warn", failed: "bad", cancelled: "", interrupted: "bad"};
const SEV = {critical: "bad", high: "bad", medium: "warn", low: "", info: ""};
const unpushed = f => f.status === "fixed" && (f.fix === "working copy" || f.fix === "committed" || (!f.fixed_in && f.fix !== "pushed"));
const FIX = {"working copy": "The fix is only in your working copy: commit and push it.", committed: "The fix is committed, not pushed yet.",
  pushed: "The fix is pushed.", "not fixed": "Its code is as it was: the fix is somewhere else, or it isn't fixed yet."};
async function copyBrief(ids, btn) {
  const was = btn.textContent;
  try {
    const got = await api("/api/brief", {ids});
    try { await navigator.clipboard.writeText(got.text); btn.textContent = "Copied " + plural(got.count, "finding"); }
    catch (e) {   // (no clipboard here: the text to copy by hand)
      const t = h("textarea", {rows: 12, class: "mono"}, got.text);
      btn.after(t); t.select(); btn.textContent = "Select and copy";
    }
  } catch (e) { btn.textContent = e.message; }
  setTimeout(() => { btn.textContent = was; }, 2500);
}
const CODE = {there: ["", "code still there"], changed: ["warn", "code changed"], gone: ["", "code gone"], unknown: ["", "code: can't tell"]};
const plural = (n, one, many) => n + " " + (n === 1 ? one : (many || one + "s"));

function show(name) {
  tab = name; clearTimeout(timer);
  const nav = document.getElementById("tabs"); put(nav);
  for (const [id, label] of TABS) nav.append(h("button", {"aria-selected": String(id === name), onclick: () => show(id)}, label));
  const view = document.getElementById("view");
  put(view, h("p", {class: "empty"}, "Loading…"));
  ({overview, start, runs, findings, explorer, rules})[name](view).catch(e => put(view, h("p", {class: "empty"}, "Couldn't load it: " + e.message)));
}

// ---------------------------------------------------------------- Overview
async function overview(view) {
  const o = await api("/api/overview");
  document.getElementById("where").textContent = o.private ? "with the private records" : "public records only";
  const tiles = h("div", {class: "tiles"},
    h("div", {class: "tile"}, h("b", {}, pct(o.seen, o.lines)), h("span", {}, "audited")),
    h("div", {class: "tile"}, h("b", {}, pct(o.full, o.lines)), h("span", {}, "by a full audit")),
    h("div", {class: "tile"}, h("b", {}, o.lines - o.seen), h("span", {}, "lines no audit has seen")),
    h("div", {class: "tile"}, h("b", {}, o.push), h("span", {}, "to audit before a push")),
    h("div", {class: "tile"}, h("b", {}, o.audits), h("span", {}, o.last ? "audits, the last " + o.last : "audits yet")));
  const checks = o.checks.map(c => h("div", {class: "card"},
    h("div", {class: "row"}, h("b", {}, c.tool), h("span", {class: "badge " + (c.bad ? "warn" : "good")}, c.bad ? "to do" : "fine"),
      h("span", {class: "mute"}, c.facts.join(" · "))),
    c.findings.length ? h("ul", {class: "plain"}, c.findings.slice(0, 12).map(f =>
      h("li", {}, f.path && f.path !== "app code" ? h("code", {}, f.path) : null, f.path && f.path !== "app code" ? " " : null, f.message))) : null));
  const commit = h("div", {class: "card"}, h("b", {}, "Waiting for you to commit"),
    !o.commit.app.length && !o.commit.private.length ? h("p", {class: "empty"}, "Nothing: every audit record is committed.") :
      h("div", {class: "grid2"},
        h("div", {}, h("p", {class: "note"}, "This repo (security/audits/)"), h("ul", {class: "plain mono"}, o.commit.app.map(p => h("li", {}, p)))),
        h("div", {}, h("p", {class: "note"}, "The private audits repo"), h("ul", {class: "plain mono"}, o.commit.private.map(p => h("li", {}, p))))),
    h("p", {class: "note"}, "Nothing here is ever committed for you."));
  put(view, tiles,
    o.push ? h("p", {class: "lead"}, plural(o.push, "line") + " no audit has seen aren't pushed yet. ",
      h("button", {class: "quiet", onclick: () => { pending = "unpushed"; show("start"); }}, "Audit them")) : null,
    h("h2", {}, "Checks"), checks, commit,
    o.problems.length ? h("div", {class: "card"}, h("b", {}, "Notes"), h("ul", {class: "plain"}, o.problems.map(p => h("li", {}, p)))) : null);
}

// ---------------------------------------------------------------- Start audit
let pending = "";
const SEVERITIES = ["critical", "high", "medium", "low", "info"], MAINS = ["affected", "not-affected", "fixed"];
const store = {get: k => { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* (not kept: fine) */ } }};
let marking = null;   // (the findings of a review being marked as audited, before it's recorded)
async function start(view) {
  opts = opts || await api("/api/options");
  marking = null;
  const form = h("div", {class: "grid2"});
  const targets = h("div", {}, h("h2", {}, "What to audit"));
  const want = pending || "uncommitted"; pending = "";
  const groups = [["New and changed code", ["uncommitted", "unpushed", "since-audit", "branch"]], ["The whole app", ["full", "unaudited"]],
    ["Findings: are they fixed?", ["open", "open-changed"]], ["Your choice", ["chosen"]]];
  const hint = {open: "Each open finding is looked for again: in your working copy, the branch as pushed, and main.",
    "open-changed": "The same, and a new audit of what's changed since the last one, in one go."};
  for (const [title, ids] of groups) {
    const here = ids.filter(id => opts.targets[id]);
    if (!here.length) continue;
    targets.append(h("h3", {class: "group"}, title));
    for (const id of here)
      targets.append(h("label", {class: "opt"}, h("input", {type: "radio", name: "target", value: id, checked: id === want, onchange: plan}),
        h("span", {}, opts.targets[id], h("small", {id: "n-" + id}, hint[id] || ""))));
  }
  const chosen = h("textarea", {rows: 4, id: "paths", placeholder: "plexcache/auth.py\nplexcache/app.py:login", oninput: () => debounce(plan)});
  targets.append(h("div", {id: "chosen", hidden: want !== "chosen"}, chosen,
    h("p", {class: "note"}, "One per line: a file, or a function in it as path:function (Class.method).")));
  const who = h("div", {}, h("label", {class: "opt"}, h("input", {type: "radio", name: "who", value: "", checked: true, onchange: pick}),
    h("span", {}, "A person", h("small", {}, "You read the code and write down what you find."),
      h("div", {class: "row", style: "margin:8px 0 0"},
        h("input", {type: "text", id: "name", placeholder: "Your name", value: store.get("audit-name"), maxlength: 40, oninput: pick}),
        h("select", {id: "closely", "aria-label": "How closely", onchange: pick}, Object.entries(opts.people).map(([k, v]) =>
          h("option", {value: k, selected: k === "3"}, v)))))));
  for (const p of opts.plugins)
    who.append(h("label", {class: "opt"}, h("input", {type: "radio", name: "who", value: p.id, onchange: pick}),
      h("span", {}, p.label, h("small", {}, "Installed on this computer: runs read-only, in a copy of the code as it is now."),
        h("div", {class: "row", style: "margin:8px 0 0"},
          h("select", {id: "auditor-" + p.id, "aria-label": "Auditor"}, p.auditors.map(a => h("option", {value: a}, a))),
          h("select", {id: "effort-" + p.id, "aria-label": "Effort"}, Object.entries(p.efforts).map(([k, v]) =>
            h("option", {value: k, selected: k === "3"}, k + " · " + v)))))));
  const side = h("div", {}, h("h2", {}, "Auditor"), who,
    h("p", {class: "note"}, "Who and how closely stay in the private repo. The public record says only that it was a full or partial audit, and of what."),
    h("h2", {}, "This audit"), h("div", {class: "card", id: "plan"}, h("p", {class: "empty"}, "…")));
  form.append(targets, side);
  const bar = h("div", {class: "card"}, h("div", {class: "row", style: "margin:0"}, h("b", {id: "summary"}, "…"),
      h("button", {class: "go", id: "go", disabled: true, onclick: go}, "Start audit"),
      h("button", {class: "quiet", id: "mark", disabled: true, onclick: markForm}, "Already audited it"),
      h("span", {class: "mute", id: "said"})),
    h("p", {class: "note", id: "how"}));
  put(view, bar, h("div", {id: "marking"}), form);
  plan();
}
let debounceT = 0;
function debounce(fn) { clearTimeout(debounceT); debounceT = setTimeout(fn, 400); }
function choice() {
  const target = (document.querySelector("input[name=target]:checked") || {}).value || "uncommitted";
  const paths = (document.getElementById("paths").value || "").split("\n").map(s => s.trim()).filter(Boolean);
  const plugin = (document.querySelector("input[name=who]:checked") || {}).value || "";
  if (!plugin) return {target, paths, name: document.getElementById("name").value.trim(), thoroughness: +document.getElementById("closely").value};
  return {target, paths, auditor: document.getElementById("auditor-" + plugin).value, thoroughness: +document.getElementById("effort-" + plugin).value};
}
let planned = false;
function pick() {
  const c = choice(), btn = document.getElementById("go"), mark = document.getElementById("mark");
  const ready = planned && (c.auditor || c.name);
  btn.disabled = !ready; mark.hidden = !!c.auditor; mark.disabled = !ready;
  btn.title = !c.auditor && !c.name ? "Your name first" : "";
  btn.textContent = c.auditor ? "Start audit" : "Start reading";
  document.getElementById("how").textContent = c.auditor ? "It runs on this computer and records what it finds; follow it on Runs."
    : (!c.name ? "Your name first (under Auditor). " : "") + "Start reading opens your audit on Runs: what to read, and your findings as you add them. " +
      "It counts the code as it is when you start, so edits made meanwhile aren't taken as audited. Already audited it records a review you've done, with what you found, in one go.";
  if (c.name) store.set("audit-name", c.name);
  if (c.auditor && marking) { marking = null; put(document.getElementById("marking")); }
}
async function plan() {
  const c = choice();
  document.getElementById("chosen").hidden = c.target !== "chosen";
  const box = document.getElementById("plan");
  planned = false; pick();
  try {
    const p = await api("/api/plan", c);
    const sum = document.getElementById("summary");
    if (p.why) { put(box, h("p", {class: "empty"}, p.why)); sum.textContent = p.why; return; }
    sum.textContent = (p.kind === "full" ? "A full audit" : "A partial audit") + " of " + plural(p.lines, "line");
    put(box, h("div", {class: "row"}, h("span", {class: "badge " + (p.kind === "full" ? "good" : "")}, p.kind), h("b", {}, plural(p.lines, "line"))),
      p.scope.length ? h("ul", {class: "plain mono"}, p.scope.slice(0, 30).map(s => h("li", {}, s)), p.scope.length > 30 ? h("li", {}, "… " + (p.scope.length - 30) + " more") : null)
        : h("p", {class: "mute"}, "All the app code."),
      h("details", {}, h("summary", {}, "The standard prompt (what to look for)"), h("pre", {class: "mono log"}, p.prompt)));
    planned = true; pick();
  } catch (e) { put(box, h("p", {class: "empty"}, e.message)); }
}
async function go() {
  const btn = document.getElementById("go"), said = document.getElementById("said");
  btn.disabled = true; said.textContent = "Starting…";
  try { const r = await api("/api/start", choice()); openRun = r.id; show("runs"); }
  catch (e) { said.textContent = e.message; btn.disabled = false; }
}
function markForm() {
  marking = marking || [];
  const box = document.getElementById("marking");
  const said = h("span", {class: "mute"});
  const record = h("button", {class: "go", onclick: async () => {
    record.disabled = true; said.textContent = "Recording…";
    try {
      const r = await api("/api/mark", {...choice(), findings: marking});
      if (r.state !== "done") throw new Error(r.error || "it wasn't recorded");
      marking = null; openRun = r.id; show("runs");
    } catch (e) { said.textContent = e.message; record.disabled = false; }
  }}, "Record it");
  put(box, h("h2", {}, "What you found"),
    findingsEditor(marking, async f => { marking.push(f); markForm(); }, async i => { marking.splice(i, 1); markForm(); }),
    h("div", {class: "row"}, record, said),
    h("p", {class: "note"}, "Recorded as seen: the code as it is now, the scope above. Nothing found is worth recording too."));
}

// a CVSS 3.1 base vector, picked metric by metric, its score worked out as it changes
const METRICS = [["AV", "Attack vector", [["N", "Network"], ["A", "Adjacent"], ["L", "Local"], ["P", "Physical"]]],
  ["AC", "Attack complexity", [["L", "Low"], ["H", "High"]]], ["PR", "Privileges required", [["N", "None"], ["L", "Low"], ["H", "High"]]],
  ["UI", "User interaction", [["N", "None"], ["R", "Required"]]], ["S", "Scope", [["U", "Unchanged"], ["C", "Changed"]]],
  ["C", "Confidentiality", [["N", "None"], ["L", "Low"], ["H", "High"]]], ["I", "Integrity", [["N", "None"], ["L", "Low"], ["H", "High"]]],
  ["A", "Availability", [["N", "None"], ["L", "Low"], ["H", "High"]]]];
function cvssPicker(vector) {
  const was = Object.fromEntries(String(vector || "").split("/").slice(1).map(p => p.split(":")));
  const score = h("span", {class: "badge"}, "…");
  const sel = {};
  const value = () => "CVSS:3.1/" + METRICS.map(([k]) => k + ":" + sel[k].value).join("/");
  const vec = h("code", {class: "note"});
  const update = async () => {
    vec.textContent = value();
    try { const got = await api("/api/cvss", {vector: value()}); score.className = "badge " + (SEV[got.severity] || ""); score.textContent = got.score.toFixed(1) + " " + got.severity; }
    catch (e) { score.textContent = e.message; }
  };
  const el = h("div", {class: "cvss"}, METRICS.map(([k, label, values]) => h("label", {}, h("small", {}, label),
    sel[k] = h("select", {onchange: update}, values.map(([v, name]) => h("option", {value: v, selected: was[k] ? was[k] === v : v === values[0][0] && !["C", "I", "A"].includes(k) || (["C", "I", "A"].includes(k) && v === "N")}, name))))),
    h("div", {class: "row", style: "margin:6px 0 0"}, h("span", {class: "mute"}, "CVSS 3.1"), score, vec));
  update();
  return {el, value};
}

// one finding's form, and the findings so far (each with Remove)
function findingsEditor(list, add, remove) {
  const title = h("input", {type: "text", placeholder: "What's wrong, in a line", style: "flex:1 1 280px"});
  const pick = cvssPicker("");
  const prio = h("select", {"aria-label": "Priority"}, ["high", "medium", "low"].map(p => h("option", {value: p, selected: p === "medium"}, "priority: " + p)));
  const prioBox = h("div", {class: "row", hidden: true}, prio, h("span", {class: "note"}, "Not exploitable as it is, so no CVSS score; it never holds up a release."));
  const kind = h("select", {"aria-label": "Kind", onchange: () => { pick.el.hidden = kind.value !== "vulnerability"; prioBox.hidden = kind.value === "vulnerability"; }},
    h("option", {value: "vulnerability"}, "Vulnerability (exploitable)"), h("option", {value: "hardening"}, "Hardening (not exploitable)"));
  const lines = h("input", {type: "text", placeholder: "plexcache/auth.py:40-52", style: "flex:1 1 220px"});
  const main = h("select", {"aria-label": "On main"}, MAINS.map(s => h("option", {value: s}, "main: " + s)));
  const detail = h("textarea", {rows: 3, placeholder: "What it is, and how it could be used"});
  const said = h("span", {class: "note"});
  const btn = h("button", {class: "quiet", onclick: async () => {
    if (!title.value.trim()) { said.textContent = "A finding needs its title."; return; }
    const got = lines.value.split(/[\s,]+/).filter(Boolean);
    if (!got.length || got.some(x => !/^[^:\s]+:\d+(-\d+)?$/.test(x))) { said.textContent = "Lines as path:line or path:start-end."; return; }
    const how = kind.value === "vulnerability" ? {type: "vulnerability", cvss: pick.value()} : {type: "hardening", severity: prio.value};
    try { await add({title: title.value.trim(), ...how, lines: got, main: main.value, detail: detail.value.trim()}); }
    catch (e) { said.textContent = e.message; }
  }}, "Add finding");
  return h("div", {},
    list.length ? list.map((f, i) => h("div", {class: "card"},
